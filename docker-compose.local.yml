# Runs the backend and the nginx-served frontend in containers, using the Supabase
# database configured in backend/.env. Open http://localhost:3000.
#
#   docker compose -f docker-compose.local.yml up --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment:
      - FLASK_ENV=production
      # Plain HTTP on localhost; the browser reaches the API through the frontend's nginx
      - FORCE_HTTPS=false
      - ALLOWED_ORIGINS=http://localhost:3000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # '/' = same origin: nginx proxies /api/ to the backend container
        VITE_API_BASE_URL: /
    ports:
      - '3000:80'
    depends_on:
      - backend
