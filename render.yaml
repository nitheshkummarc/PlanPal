services:
  - type: web
    name: planpal-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    # The schema is managed in Supabase with database/init.sql and database/migrations/
    startCommand: "cd backend && gunicorn run:app --bind 0.0.0.0:$PORT --threads 4"
    # Only route traffic to a new deploy once it can reach the database
    healthCheckPath: /api/system/ready
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://planpal-silk.vercel.app
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Background jobs: event reminders and revoked-token cleanup
      - key: ENABLE_TASK_SCHEDULER
        value: "true"
      # Optional: Redis for rate-limit counters; unset = in-memory (fine for one worker)
      - key: REDIS_URL
        sync: false
